[package]
name = "gd32vf103xx-hal-nyaa"
version = "0.6.0"
authors = ["The RISC-V Team <risc-v@teams.rust-embedded.org>", "DorotaC.eu"]
repository = "https://github.com/dcz-self/gd32vf103xx-hal-nyaa"
categories = ["embedded", "hardware-support", "no-std"]
description = "Bleeding-edge HAL for GD32VF103 microcontrollers"
keywords = ["riscv", "gd32", "hal"]
license = "ISC"
edition = "2024"

[dependencies]
gd32vf103-pac = "0.4.0"
nuclei-n205 = { version = "0.1.0", registry = "airdrop-rs" }
riscv = "0.6.0"
nb = "0.1.2"
void = { version = "1.0.2", default-features = false }
cast = { version = "0.2.3", default-features = false }
vcell = "0.1.2"
embedded-dma = "0.1.2"

[dependencies.embedded-hal]
version = "0.2.3"
features = ["unproven"]

[features]
rt = ["gd32vf103-pac/rt"]
